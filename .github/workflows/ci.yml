name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies (all extras so pyright can resolve every adapter)
        working-directory: backend
        run: uv sync --frozen --all-extras
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .
      - name: Pyright (strict)
        working-directory: backend
        run: uv run pyright
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra local
      - name: Pytest (all tests, integration included) with coverage gate
        working-directory: backend
        run: uv run pytest --cov=sovereign_rag --cov-fail-under=80 -m ""

  core-no-azure:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: openai_compatible
      OPENAI_COMPAT_BASE_URL: http://fake:8001/v1
      OPENAI_COMPAT_MODEL: fake
      EMBEDDING_PROVIDER: azure_openai
      AZURE_OPENAI_ENDPOINT: https://fake.example
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: fake
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install core profile (no extras)
        working-directory: backend
        run: uv sync --frozen
      - name: Boot create_app under the core profile and assert no azure module loads
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import sys

          from sovereign_rag.config import Settings
          from sovereign_rag.main import create_app

          create_app(Settings(_env_file=None))
          loaded = [m for m in sys.modules if m == "azure" or m.startswith("azure.")]
          assert not loaded, f"azure modules loaded in core profile: {loaded}"
          print("core profile OK: create_app() ran without loading any azure module")
          PY

  bench-smoke:
    # Retrieval pipeline gate: seed the demo corpus, replay a 10-question
    # slice of the public bench (cross-lingual included) through /api/chat,
    # and fail below the floors. No LLM: the sources SSE event is emitted
    # after retrieval, before generation. Floors are wreck detectors around
    # the measured e5-small baseline (hit@8 10/10, MRR 0.58), not quality
    # targets: the full bench with its published numbers stays in bench/.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          # The post-job cache prune would wait on the uv lock held by the
          # backgrounded API; the kill step below is the real cleanup.
          prune-cache: false
      - name: Install backend with the local embeddings extra
        working-directory: backend
        run: uv sync --frozen --all-extras
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-${{ hashFiles('backend/uv.lock') }}
      - name: Boot the API and seed the demo corpus
        working-directory: backend
        env:
          DATABASE_URL: postgresql://rag:rag@localhost:5432/rag_smoke
          EMBEDDING_PROVIDER: local
          EMBEDDING_MODEL: intfloat/multilingual-e5-small
          EMBEDDING_DIMENSIONS: "384"
          RERANKER_PROVIDER: none
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://localhost:59999
          AUTH_API_KEYS: '{"sk-demo-admin":"admin"}'
          AUTH_ADMIN_USERS: '["admin"]'
          SEED_DEMO_DATA: "true"
        run: |
          nohup uv run uvicorn sovereign_rag.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/healthz > /dev/null && break
            sleep 2
          done
          for i in $(seq 1 90); do
            ready=$(curl -s -H "Authorization: Bearer sk-demo-admin"               http://localhost:8000/api/documents               | python3 -c "import json,sys; print(sum(1 for d in json.load(sys.stdin) if d['status']=='ready'))"               || echo 0)
            [ "$ready" = "3" ] && exit 0
            sleep 2
          done
          echo "demo corpus never became ready"; tail -50 /tmp/api.log; exit 1
      - name: Replay the smoke golden through the API
        working-directory: backend
        run: |
          uv run ../bench/run.py ci-smoke --golden ../bench/golden_smoke.json \
            --min-hit8 0.9 --min-mrr 0.45 || { tail -50 /tmp/api.log; exit 1; }
      - name: Stop the API
        if: always()
        run: pkill -f "uvicorn sovereign_rag" || true

  build:
    needs: [test, core-no-azure]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: sovereign-rag-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: sovereign-rag-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sovereign-rag-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sovereign-rag-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  publish:
    # Every merge to main ships both images to GHCR, tagged latest + sha.
    # PRs never publish: the build job (with its Trivy gate) is the only
    # image work they run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Multi-arch: the arm64 half builds under QEMU; slow on a cold layer
    # cache (torch install and model bake emulated), then amortized by the
    # per-scope gha cache.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via the GitHub OIDC token
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase the image namespace (ghcr rejects uppercase)
        id: ns
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Push backend image
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.repo }}-api:latest
            ghcr.io/${{ steps.ns.outputs.repo }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Push frontend image
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.repo }}-frontend:latest
            ghcr.io/${{ steps.ns.outputs.repo }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Sign both images (keyless, Sigstore transparency log)
        env:
          API_DIGEST: ${{ steps.push-api.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.push-frontend.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ steps.ns.outputs.repo }}-api@${API_DIGEST}"
          cosign sign --yes "ghcr.io/${{ steps.ns.outputs.repo }}-frontend@${FRONTEND_DIGEST}"

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: No terraform yet (Phase 4), pass as no-op
        if: hashFiles('deploy/azure/**/*.tf') == ''
        run: echo "deploy/azure contains no .tf files yet; skipping terraform checks"
      - uses: hashicorp/setup-terraform@v3
        if: hashFiles('deploy/azure/**/*.tf') != ''
      - name: Terraform fmt
        if: hashFiles('deploy/azure/**/*.tf') != ''
        run: terraform fmt -check -recursive deploy/azure
      - name: Terraform validate
        if: hashFiles('deploy/azure/**/*.tf') != ''
        run: |
          terraform -chdir=deploy/azure init -backend=false
          terraform -chdir=deploy/azure validate
