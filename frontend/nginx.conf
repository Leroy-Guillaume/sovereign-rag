# Deployed as /etc/nginx/conf.d/default.conf inside nginxinc/nginx-unprivileged.
# The base image already runs the workers as a non-root user (uid 101) and
# keeps pid/temp files in writable locations, so this config only has to
# avoid privileged ports: listen on 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: client-side routes (/admin, /?c=<uuid>) resolve to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API proxy (no CORS needed). proxy_buffering off is REQUIRED
    # for /api/chat: with buffering on, nginx would batch the SSE deltas and
    # the UI would receive the whole answer in one burst.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
